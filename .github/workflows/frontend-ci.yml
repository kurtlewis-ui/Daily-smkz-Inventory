name: Frontend CI

# Runs on every pull request that touches the frontend, and on pushes to main.
# Purpose: automatically catch broken builds / lint errors BEFORE a PR is
# merged. Once branch protection requires this check, a red build cannot be
# merged into main — the same kind of error that slipped through before
# (e.g. an unknown font import) is caught here automatically.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies. Uses npm install (not npm ci) to match the
      # Vercel install command and to tolerate lockfile drift when a new
      # dependency is added in the same PR.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Lint — fails the job on ESLint ERRORS. Warnings do not fail the build
      # (Next's default lint behavior), so a stray warning won't block work.
      - name: Lint
        run: npm run lint

      # Production build — this is the real gate. If the app doesn't compile
      # (type errors, bad imports, unknown fonts, etc.) this step fails and
      # the PR shows a red check.
      - name: Build
        run: npm run build
        env:
          # A dummy public API URL so the build doesn't fail on a missing env
          # var. The build only needs this to be defined; no network calls are
          # made at build time.
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
